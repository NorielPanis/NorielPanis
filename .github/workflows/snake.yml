name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # refresh twice a day
  workflow_dispatch:        # lets you run it manually
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/github-snake.svg?color_snake=%233b82f6&color_dots=%23ebedf0,%2393c5fd,%2360a5fa,%233b82f6,%231d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2360a5fa&color_dots=%23161b22,%231e3a8a,%231d4ed8,%232563eb,%2360a5fa

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
